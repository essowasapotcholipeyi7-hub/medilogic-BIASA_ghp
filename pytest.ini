[pytest]
testpaths = tests
# ⭐ Sans ce pythonpath, `from utils.dates import ...` (tests/test_dates.py)
# ne marche QUE si on lance `python -m pytest` (qui ajoute automatiquement
# le répertoire courant à sys.path) — le simple `pytest -v` utilisé par la
# CI (.github/workflows/tests.yml) n'a pas ce comportement et échoue avec
# "ModuleNotFoundError: No module named 'utils'" -> "Interrupted: 1 error
# during collection" (repéré en CI côté GHP, non reproduit en local où le
# premier essai utilisait `python -m pytest`). pythonpath (natif pytest >=
# 7) force l'ajout de la racine du dépôt à sys.path avant la collecte,
# quelle que soit la commande utilisée pour lancer pytest.
pythonpath = .
