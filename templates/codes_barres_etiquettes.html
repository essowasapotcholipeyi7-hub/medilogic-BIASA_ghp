<!-- templates/codes_barres_etiquettes.html -->
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Étiquettes {{ 'actes' if type_article == 'acte' else 'produits' }}</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.6/JsBarcode.all.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, Helvetica, sans-serif; background: #ccc; padding: 10px; }
        .no-print { margin-bottom: 15px; }
        .planche {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4mm;
            max-width: 210mm;
            margin: 0 auto;
            background: white;
            padding: 5mm;
        }
        .etiquette {
            border: 1px dashed #999;
            padding: 2mm;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 28mm;
            overflow: hidden;
        }
        .etiquette .nom {
            font-size: 9px;
            font-weight: bold;
            line-height: 1.1;
            max-height: 20px;
            overflow: hidden;
            margin-bottom: 2px;
        }
        @media print {
            .no-print { display: none !important; }
            body { background: white; padding: 0; }
            .planche { padding: 0; }
            .etiquette { border: 1px solid #bbb; break-inside: avoid; }
        }
    </style>
</head>
<body>
    <div class="no-print">
        <button onclick="window.print()">Imprimer la planche d'étiquettes</button>
    </div>

    {% if not lignes %}
    <p>Aucun code-barres attribué pour l'instant.</p>
    {% else %}
    <div class="planche">
        {% for l in lignes %}
        <div class="etiquette">
            <div class="nom">{{ l.nom_article }}</div>
            <svg class="barcode" data-code="{{ l.code_barre }}"></svg>
        </div>
        {% endfor %}
    </div>
    {% endif %}

    <script>
        document.querySelectorAll('svg.barcode').forEach(function(svg) {
            JsBarcode(svg, svg.dataset.code, { format: 'CODE128', width: 1.2, height: 26, fontSize: 9, margin: 0 });
        });
    </script>
</body>
</html>
