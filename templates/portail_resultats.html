{% extends "base.html" %}
{% set cacher_navigation = True %}

{% block title %}Mes résultats{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7">
        <div class="d-flex justify-content-between align-items-center mt-4 mb-3">
            <h5 class="mb-0"><i class="fas fa-file-medical me-2"></i>Mes résultats</h5>
            <a href="{{ url_for('portail_patient_deconnexion') }}" class="btn btn-sm btn-outline-secondary">
                <i class="fas fa-sign-out-alt me-1"></i> Fermer
            </a>
        </div>

        <div id="ppProchainRdv" style="display:none;" class="alert alert-info">
            <i class="fas fa-calendar-check me-1"></i>
            <strong>Prochain rendez-vous :</strong> <span id="ppRdvTexte"></span>
        </div>

        <div class="card">
            <div class="card-header bg-dark text-white">Résultats disponibles</div>
            <div class="card-body p-0" id="ppListeResultats">
                <div class="text-center text-muted py-4">Chargement...</div>
            </div>
        </div>
    </div>
</div>

<script>
fetch('/api/portail-patient/resultats').then(r => r.json()).then(data => {
    if (!data.success) { window.location.href = "{{ url_for('page_portail_patient') }}"; return; }

    if (data.prochain_rdv) {
        document.getElementById('ppRdvTexte').textContent =
            `${data.prochain_rdv.date} à ${data.prochain_rdv.heure}` +
            (data.prochain_rdv.medecin_nom ? ` avec Dr. ${data.prochain_rdv.medecin_nom}` : '') +
            (data.prochain_rdv.motif ? ` — ${data.prochain_rdv.motif}` : '');
        document.getElementById('ppProchainRdv').style.display = 'block';
    }

    const conteneur = document.getElementById('ppListeResultats');
    if (!data.resultats.length) {
        conteneur.innerHTML = '<div class="text-center text-muted py-4">Aucun résultat disponible pour le moment.</div>';
        return;
    }
    conteneur.innerHTML = '<div class="list-group list-group-flush">' + data.resultats.map(r => `
        <div class="list-group-item d-flex justify-content-between align-items-center">
            <div>
                <div class="fw-bold">${r.acte_nom}</div>
                <div class="text-muted small">Disponible depuis le ${r.date_resultat}</div>
            </div>
            <a href="/api/portail-patient/resultats/${r.resultat_id}/telecharger" target="_blank" class="btn btn-sm btn-primary">
                <i class="fas fa-download me-1"></i> Télécharger / Imprimer
            </a>
        </div>
    `).join('') + '</div>';
});
</script>
{% endblock %}
