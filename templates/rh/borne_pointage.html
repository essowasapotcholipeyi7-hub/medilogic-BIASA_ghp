<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Borne de pointage — {{ session.get('structure_nom') or 'Structure' }}</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            height: 100%;
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex; align-items: center; justify-content: center;
            overflow: hidden;
        }
        .borne {
            width: 100%; max-width: 680px; padding: 20px;
            text-align: center; color: white;
        }
        .structure-nom { font-size: 18px; opacity: .85; margin-bottom: 4px; }
        .horloge { font-size: 48px; font-weight: 700; font-variant-numeric: tabular-nums; margin-bottom: 4px; }
        .date-jour { font-size: 16px; opacity: .85; margin-bottom: 22px; text-transform: capitalize; }

        .bascule-mode {
            display: inline-flex; background: rgba(255,255,255,0.12);
            border-radius: 12px; padding: 4px; margin-bottom: 18px;
        }
        .bascule-mode button {
            border: none; background: transparent; color: white; opacity: .7;
            padding: 8px 18px; border-radius: 9px; font-size: 14px; cursor: pointer;
        }
        .bascule-mode button.actif { background: white; color: #4b3f91; opacity: 1; font-weight: 700; }

        .carte {
            background: rgba(255,255,255,0.12);
            border: 1px solid rgba(255,255,255,0.25);
            border-radius: 20px;
            padding: 40px 30px;
            backdrop-filter: blur(6px);
        }
        .icone-empreinte { font-size: 90px; margin-bottom: 10px; }
        .consigne { font-size: 15px; opacity: .9; margin-bottom: 26px; }

        .btn-pointer {
            display: inline-flex; align-items: center; gap: 10px;
            background: white; color: #4b3f91;
            border: none; border-radius: 14px;
            padding: 18px 50px; font-size: 20px; font-weight: 700;
            cursor: pointer; transition: transform .15s ease;
        }
        .btn-pointer:hover:not(:disabled) { transform: translateY(-2px); }
        .btn-pointer:disabled { opacity: .6; cursor: wait; }

        /* ⭐ Grand cadre caméra (avant : 320 px) avec guide ovale et contour du visage. */
        .cadre-visage {
            position: relative; width: 100%; max-width: 620px; margin: 0 auto;
            aspect-ratio: 4 / 3; border-radius: 18px; overflow: hidden; background: rgba(0,0,0,0.3);
        }
        .cadre-visage video, .cadre-visage canvas {
            position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1);
        }
        .cadre-visage .guide {
            position: absolute; left: 50%; top: 50%; width: 44%; height: 72%; transform: translate(-50%, -50%);
            border: 3px dashed rgba(255,255,255,0.6); border-radius: 50%; pointer-events: none;
        }
        .consigne-visage { font-size: 20px; font-weight: 700; margin-top: 12px; min-height: 28px; }
        /* ⭐ Veille : caméra coupée après quelques minutes sans visage (batterie). */
        .veille-visage {
            position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 10px; background: rgba(20, 16, 50, 0.82); color: white; font-size: 18px; cursor: pointer; text-align: center; padding: 20px;
        }
        .veille-visage i { font-size: 46px; opacity: .85; }
        .carte.mode-visage { padding: 18px; }
        @media (max-height: 760px) { .horloge { font-size: 34px; } .date-jour { margin-bottom: 10px; } }
        .pastille-scan {
            font-size: 13px; opacity: .8; margin-top: 10px;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .pastille-scan .point {
            width: 8px; height: 8px; border-radius: 50%; background: #7CFFB2;
            animation: clignote 1.4s infinite;
        }
        @keyframes clignote { 0%,100%{opacity:.3;} 50%{opacity:1;} }

        .resultat { margin-top: 20px; font-size: 17px; min-height: 26px; }
        .resultat.succes { color: #b6ffcf; }
        .resultat.erreur { color: #ffd0d0; }
        .resultat.deja { color: #e8f4ff; }
        /* ⭐ Employé en congé / permission : message bien visible, rien n'est pointé. */
        .resultat.absence { color: #3b2a00; background: #ffd666; border-radius: 12px; padding: 14px 16px;
                            font-size: 19px; font-weight: 600; line-height: 1.45; text-align: left; }
        .resultat.absence i { margin-right: 6px; }

        .liste-jour {
            margin-top: 26px; text-align: left; max-height: 130px; overflow-y: auto;
            font-size: 13px; opacity: .85;
        }
        .liste-jour .ligne { display: flex; justify-content: space-between; padding: 3px 6px; }
        .avertissement { margin-top: 18px; font-size: 12px; opacity: .7; }
        [hidden] { display: none !important; }
    </style>
</head>
<body>
    <div class="borne">
        <div class="structure-nom">{{ session.get('structure_nom') or '' }}</div>
        <div class="horloge" id="horloge">--:--:--</div>
        <div class="date-jour" id="dateJour">-</div>

        <div class="bascule-mode">
            <button id="btnModeEmpreinte" class="actif" onclick="basculerMode('empreinte')"><i class="fas fa-fingerprint"></i> Empreinte</button>
            <button id="btnModeVisage" onclick="basculerMode('visage')"><i class="fas fa-camera"></i> Visage</button>
        </div>

        <div class="carte">
            <!-- Mode empreinte -->
            <div id="panneauEmpreinte">
                <div class="icone-empreinte"><i class="fas fa-fingerprint"></i></div>
                <div class="consigne">Posez le doigt sur le capteur du poste</div>
                <button class="btn-pointer" id="btnPointer" onclick="pointer()">
                    <i class="fas fa-hand-point-up"></i> Pointer
                </button>
            </div>

            <!-- Mode visage -->
            <div id="panneauVisage" hidden>
                <div class="cadre-visage">
                    <video id="videoVisage" autoplay muted playsinline></video>
                    <canvas id="canvasVisage"></canvas>
                    <div class="guide"></div>
                    <div class="veille-visage" id="veilleVisage" hidden>
                        <i class="fas fa-moon"></i>
                        <div>Caméra en veille pour économiser la batterie.</div>
                        <strong>Touchez l'écran pour pointer</strong>
                    </div>
                </div>
                <div class="consigne-visage" id="consigneVisage"></div>
                <div class="pastille-scan" id="pastilleScan"><span class="point"></span> Recherche d'un visage...</div>
            </div>

            <div class="resultat" id="resultat"></div>
            <div class="liste-jour" id="listeJour"></div>
        </div>

        <div class="avertissement" id="avertissementContexte"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@simplewebauthn/browser@10.0.0/dist/bundle/index.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    <script src="{{ url_for('static', filename='js/pointage_biometrie.js') }}"></script>
    <script>
        function majHorloge() {
            const maintenant = new Date();
            document.getElementById('horloge').textContent = maintenant.toLocaleTimeString('fr-FR');
            document.getElementById('dateJour').textContent = maintenant.toLocaleDateString('fr-FR', {
                weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
            });
        }
        setInterval(majHorloge, 1000);
        majHorloge();

        // ============================================================
        // BASCULE ENTRE LES DEUX MODES
        // ============================================================
        let modeActuel = 'empreinte';

        function basculerMode(mode) {
            if (mode === modeActuel) return;
            modeActuel = mode;
            document.getElementById('btnModeEmpreinte').classList.toggle('actif', mode === 'empreinte');
            document.getElementById('btnModeVisage').classList.toggle('actif', mode === 'visage');
            document.getElementById('panneauEmpreinte').hidden = mode !== 'empreinte';
            document.getElementById('panneauVisage').hidden = mode !== 'visage';
            document.querySelector('.carte').classList.toggle('mode-visage', mode === 'visage');
            document.getElementById('resultat').className = 'resultat';
            document.getElementById('resultat').textContent = '';

            try { localStorage.setItem('borne_mode_pointage', mode); } catch (e) { /* stockage indisponible */ }
            if (mode === 'visage') { demarrerModeVisage(); } else { arreterModeVisage(); }
        }

        // ============================================================
        // MODE EMPREINTE (WebAuthn)
        // ============================================================
        if (!window.SimpleWebAuthnBrowser || !SimpleWebAuthnBrowser.browserSupportsWebAuthn()) {
            document.getElementById('avertissementContexte').textContent =
                "Empreinte/visage indisponibles sur ce poste/navigateur (nécessite http://localhost ou HTTPS).";
        }

        async function pointer() {
            const btn = document.getElementById('btnPointer');
            const resultat = document.getElementById('resultat');
            resultat.className = 'resultat';

            if (!window.SimpleWebAuthnBrowser || !SimpleWebAuthnBrowser.browserSupportsWebAuthn()) {
                resultat.className = 'resultat erreur';
                resultat.textContent = "Empreinte non disponible sur ce poste/navigateur.";
                return;
            }

            btn.disabled = true;
            resultat.textContent = 'Posez le doigt sur le capteur...';

            try {
                const rOpt = await fetch('/rh/api/pointage/webauthn/options', {method: 'POST'});
                if (rOpt.status === 401) throw {message: "La borne n'est plus connectée : reconnectez-vous au logiciel sur ce poste."};
                const dOpt = await rOpt.json();
                if (!dOpt.success) {
                    resultat.className = 'resultat erreur';
                    resultat.textContent = dOpt.message;
                    return;
                }

                const assertion = await SimpleWebAuthnBrowser.startAuthentication(dOpt.options);

                const rVer = await fetch('/rh/api/pointage/webauthn/verifier', {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({credential: assertion})
                });
                const dVer = await rVer.json();
                afficherResultatPointage(dVer);
            } catch (err) {
                console.error(err);
                resultat.className = 'resultat erreur';
                resultat.textContent = err && err.name ? PointageBiometrie.messageErreurEmpreinte(err) : ("Échec : " + (err.message || err));
            } finally {
                btn.disabled = false;
            }
        }

        // ============================================================
        // MODE VISAGE (webcam + face-api.js, détection automatique)
        // ============================================================
        // ⭐ Patron (2026-10-11) : « ultra sensible, que ça capte le visage rapidement »
        // et « si plus aucun visage ne passe, que la caméra se ferme ».
        const DELAI_VEILLE_MS = 3 * 60 * 1000;      // caméra coupée après 3 min sans visage
        let fluxCameraVisage = null;
        let boucleVisageActive = false;
        let generationVisage = 0;                    // une seule boucle à la fois
        let minuterieVeille = null;
        let enVeille = false;
        let dernierVisage = null;                    // {descripteur, quand} du dernier envoi

        const pause = ms => new Promise(r => setTimeout(r, ms));

        async function demarrerModeVisage() {
            const generation = ++generationVisage;
            const pastille = document.getElementById('pastilleScan');
            document.getElementById('veilleVisage').hidden = true;
            enVeille = false;
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                pastille.textContent = "Caméra non disponible sur ce poste/navigateur (nécessite https ou http://localhost).";
                return;
            }
            pastille.innerHTML = '<span class="point"></span> Chargement de la reconnaissance faciale...';
            if (!await PointageBiometrie.chargerModeles()) {
                pastille.textContent = "Échec du chargement de la reconnaissance faciale (connexion internet ?).";
                return;
            }
            let flux;
            try {
                flux = await PointageBiometrie.ouvrirCamera(document.getElementById('videoVisage'));
            } catch (err) {
                pastille.textContent = "Accès à la caméra refusé ou indisponible : autorisez la caméra pour ce site.";
                return;
            }
            if (generation !== generationVisage || modeActuel !== 'visage') { PointageBiometrie.fermerCamera(flux); return; }
            fluxCameraVisage = flux;
            pastille.innerHTML = '<span class="point"></span> Caméra prête';
            if (minuterieVeille) minuterieVeille.arreter();
            minuterieVeille = PointageBiometrie.minuterieVeille(DELAI_VEILLE_MS, mettreEnVeille);
            boucleVisageActive = true;
            boucleDetectionVisage(generation);
        }

        function arreterModeVisage() {
            generationVisage++;
            boucleVisageActive = false;
            if (minuterieVeille) { minuterieVeille.arreter(); minuterieVeille = null; }
            PointageBiometrie.fermerCamera(fluxCameraVisage);
            fluxCameraVisage = null;
            document.getElementById('videoVisage').srcObject = null;
            PointageBiometrie.dessiner(document.getElementById('canvasVisage'), null);
        }

        function mettreEnVeille() {
            if (modeActuel !== 'visage') return;
            arreterModeVisage();
            enVeille = true;
            document.getElementById('veilleVisage').hidden = false;
            document.getElementById('consigneVisage').textContent = '';
            document.getElementById('pastilleScan').innerHTML = '<span class="point"></span> En veille';
        }

        function reveillerCamera() {
            if (modeActuel === 'visage' && enVeille) demarrerModeVisage();
        }
        // toucher n'importe où sur la borne la réveille
        document.addEventListener('pointerdown', () => { if (enVeille) reveillerCamera(); });
        // borne masquée (autre fenêtre, écran éteint) : caméra coupée, rallumée au retour
        document.addEventListener('visibilitychange', () => {
            if (modeActuel !== 'visage') return;
            if (document.hidden) { if (boucleVisageActive) { arreterModeVisage(); enVeille = true; } }
            else if (enVeille && document.getElementById('veilleVisage').hidden) demarrerModeVisage();
        });

        async function boucleDetectionVisage(generation) {
            const video = document.getElementById('videoVisage');
            const canvas = document.getElementById('canvasVisage');
            const consigne = document.getElementById('consigneVisage');
            const active = () => boucleVisageActive && generation === generationVisage;
            while (active()) {
                // suivi en direct : détection seule, très rapide
                let r;
                try { r = await PointageBiometrie.detecter(video); } catch (e) { r = {etat: 'aucun'}; }
                if (!active()) break;
                if (r.etat !== 'aucun' && minuterieVeille) minuterieVeille.toucher();
                PointageBiometrie.dessiner(canvas, r);
                consigne.textContent = PointageBiometrie.CONSIGNES[r.etat];
                if (r.etat !== 'ok') { await pause(r.etat === 'aucun' ? 120 : 40); continue; }

                // visage bien placé : 2 images moyennées, puis vérification
                consigne.textContent = 'Vérification…';
                const ech = await PointageBiometrie.echantillonner(video, 2, rr => PointageBiometrie.dessiner(canvas, rr), 40);
                if (!active()) break;
                if (ech.erreur) {
                    afficherResultatPointage({success: false, message: ech.erreur});
                    await pause(1200);
                    continue;
                }
                // même personne toujours devant la borne : son résultat reste affiché, sans nouvel envoi
                if (dernierVisage && Date.now() - dernierVisage.quand < 20000
                        && PointageBiometrie.distance(dernierVisage.descripteur, ech.descripteur) < 0.35) {
                    consigne.textContent = 'Pointage déjà traité — personne suivante';
                    await pause(1000);
                    continue;
                }
                dernierVisage = null;
                try {
                    const rep = await fetch('/rh/api/pointage/facial/verifier', {
                        method: 'POST', headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({descripteur: ech.descripteur})
                    });
                    if (rep.status === 401) afficherResultatPointage({success: false, message: "La borne n'est plus connectée : reconnectez-vous au logiciel sur ce poste."});
                    else {
                        const donnees = await rep.json();
                        afficherResultatPointage(donnees);
                        // personne reconnue (pointée, déjà pointée, ou en congé) : pas de nouvel envoi pendant 20 s
                        if (donnees.success || donnees.deja || donnees.absence) dernierVisage = {descripteur: ech.descripteur, quand: Date.now()};
                    }
                } catch (err) {
                    afficherResultatPointage({success: false, message: 'Erreur réseau : vérifiez la connexion.'});
                }
                if (minuterieVeille) minuterieVeille.toucher();
                // le temps de lire le résultat et de laisser la place à la personne suivante
                PointageBiometrie.dessiner(canvas, null);
                consigne.textContent = 'Personne suivante dans un instant…';
                await pause(3000);
            }
        }

        // ============================================================
        // AFFICHAGE DU RÉSULTAT (commun empreinte/visage)
        // ============================================================
        function afficherResultatPointage(reponse) {
            const resultat = document.getElementById('resultat');
            if (reponse.success) {
                const d = reponse.data;
                resultat.className = 'resultat succes';
                if (d.type === 'arrivee') {
                    const statutTxt = d.statut === 'retard' ? `retard de ${d.retard_minutes} min` : 'à l\'heure';
                    resultat.innerHTML = `<i class="fas fa-circle-check"></i> Bonjour ${d.employe_nom} — arrivée ${d.heure} (${statutTxt})`;
                } else {
                    resultat.innerHTML = `<i class="fas fa-circle-check"></i> Au revoir ${d.employe_nom} — départ ${d.heure}`;
                }
                chargerListeJour();
            } else if (reponse.deja) {
                resultat.className = 'resultat deja';
                resultat.innerHTML = '<i class="fas fa-circle-info"></i> ';
                resultat.appendChild(document.createTextNode(reponse.message));
            } else if (reponse.absence) {
                // ⭐ En congé / permission : pas de pointage, passage signalé à la RH.
                resultat.className = 'resultat absence';
                resultat.innerHTML = '<i class="fas fa-umbrella-beach"></i>';
                resultat.appendChild(document.createTextNode(reponse.message));
            } else {
                resultat.className = 'resultat erreur';
                resultat.textContent = reponse.message;
            }
        }

        function chargerListeJour() {
            fetch('/rh/api/pointage/liste?date=' + new Date().toISOString().split('T')[0])
                .then(r => r.json())
                .then(d => {
                    if (!d.success) return;
                    const zone = document.getElementById('listeJour');
                    if (d.pointages.length === 0) { zone.innerHTML = ''; return; }
                    zone.innerHTML = d.pointages.slice(-6).reverse().map(p => `
                        <div class="ligne">
                            <span>${p.employe_nom}</span>
                            <span>${p.heure_arrivee || ''}${p.heure_depart ? ' → ' + p.heure_depart : ''}</span>
                        </div>`).join('');
                })
                .catch(() => {});
        }
        chargerListeJour();
        setInterval(chargerListeJour, 30000);

        // ⭐ Réseaux du visage chargés et préchauffés dès l'ouverture : le mode Visage
        // démarre instantanément ; la borne reprend le dernier mode utilisé.
        if (window.faceapi) PointageBiometrie.chargerModeles();
        try { if (localStorage.getItem('borne_mode_pointage') === 'visage') basculerMode('visage'); } catch (e) { /* stockage indisponible */ }
    </script>
</body>
</html>
