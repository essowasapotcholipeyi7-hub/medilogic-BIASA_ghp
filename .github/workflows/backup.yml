name: Sauvegarde base de donnees

# patron : "mets en place la sauvegarde" — audit du 2026-09-28 : aucune
# sauvegarde automatique n'existait. La seule chose qui s'en rapprochait
# (utils/db_failover.py) n'en est pas une : elle efface son fichier
# immediatement apres usage et ne tourne meme pas sur Render (production).
# Les seules vraies sauvegardes trouvees pour BIASA etaient 2 fichiers
# crees a la main sur l'ordinateur d'un developpeur, jamais mis en
# securite (aucune pour GHP).
#
# Ce workflow fait une sauvegarde automatique quotidienne de la base
# Neon, CHIFFREE avant d'etre stockee (le depot est public — jamais de
# donnees patients en clair), conservee 30 jours glissants.
#
# ⚠️ SETUP REQUIS (une seule fois) — 2 secrets a ajouter dans GitHub :
# Settings > Secrets and variables > Actions > "New repository secret"
#   - BACKUP_DATABASE_URL : meme valeur que DATABASE_URL sur Render
#     (Render > service BIASA > Environment) ou dans le fichier .env local.
#   - BACKUP_PASSPHRASE   : la phrase de chiffrement generee pour ce depot
#     — a conserver precieusement (gestionnaire de mots de passe) : sans
#     elle, personne ne peut lire les sauvegardes, pas meme nous. Voir
#     scripts/restaurer_sauvegarde.py pour restaurer une sauvegarde en cas
#     de besoin reel.
on:
  schedule:
    - cron: '0 3 * * *'  # tous les jours a 3h du matin UTC
  workflow_dispatch:  # bouton "Run workflow" pour tester manuellement

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Installer pg_dump (version recente, compatible Neon)
        run: |
          # ⭐ FIX : "apt-get install postgresql-client" tout court installe
          # la version des dépôts Ubuntu par défaut, plus ancienne que Neon
          # (serveur en version 17.11) — pg_dump refuse alors avec "aborting
          # because of server version mismatch". Repéré en observant que le
          # job "réussissait" quand même avec un dump de 201 octets au lieu
          # de plusieurs Mo (voir aussi le fix du bug de capture de code de
          # sortie juste en dessous, qui masquait cet échec). Dépôt officiel
          # PGDG pour avoir une version récente du client — la version 17
          # du dépôt PGDG a ENCORE échoué avec la même erreur (voir
          # historique git), passé en version 18 : c'est précisément la
          # version qui a fonctionné lors du test manuel en local contre ce
          # même serveur Neon (18.6, un cran au-dessus de 17.11 — toujours
          # sûr, pg_dump gère un client plus récent que le serveur).
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl ca-certificates gnupg lsb-release
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/keyrings/postgresql-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/postgresql-keyring.gpg] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-18
          echo "::notice::$(pg_dump --version)"

      - name: Sauvegarder la base de donnees
        env:
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Le secret BACKUP_DATABASE_URL n'est pas configuré (Settings > Secrets and variables > Actions)"
            exit 1
          fi
          # ⭐ FIX (2e tentative) : capturer $? DANS "if ! commande; then"
          # donnait le code du TEST "if", pas celui de pg_dump — corrigé en
          # sortant la commande du "if". Mais ça a révélé un AUTRE piège :
          # bash tourne ici avec "set -e" par défaut (comportement GitHub
          # Actions), qui arrête le script IMMÉDIATEMENT dès qu'une
          # commande simple échoue — avant même d'atteindre "code=$?" et le
          # message d'erreur détaillé, qui ne s'affichaient donc jamais
          # (juste "Process completed with exit code 1", repéré en
          # conditions réelles). "set +e"/"set -e" autour de la seule
          # commande à risque neutralise ce comportement le temps de
          # capturer le vrai code de sortie, sans le désactiver pour le
          # reste du script.
          set +e
          pg_dump "$DATABASE_URL" -Fc -f backup.dump 2>pgdump_stderr.log
          code=$?
          set -e
          if [ $code -ne 0 ]; then
            # Redige tout segment "utilisateur:motdepasse@" avant
            # d'afficher l'erreur — les logs de ce job (via l'annotation
            # ::error::) sont lisibles publiquement sans connexion sur un
            # dépôt public, contrairement au log complet du job.
            safe_error=$(sed -E 's#://[^:]+:[^@]+@#://[REDACTED]@#g' pgdump_stderr.log)
            echo "::error::pg_dump a échoué (code $code) : $safe_error"
            exit $code
          fi
          taille=$(wc -c < backup.dump)
          echo "::notice::backup.dump fait $taille octets"
          # ⭐ Un vrai dump de cette base fait plusieurs Mo — un fichier
          # anormalement petit (échec silencieux, mauvaise base, etc.) ne
          # doit jamais passer pour une sauvegarde réussie.
          if [ "$taille" -lt 10000 ]; then
            echo "::error::backup.dump ne fait que $taille octets — beaucoup trop petit pour être une vraie sauvegarde, arrêt."
            exit 1
          fi

      - name: Chiffrer la sauvegarde
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error::Le secret BACKUP_PASSPHRASE n'est pas configuré (Settings > Secrets and variables > Actions)"
            exit 1
          fi
          openssl enc -aes-256-cbc -pbkdf2 -salt \
            -in backup.dump -out "backup-$(date +%Y-%m-%d).dump.enc" \
            -pass pass:"$BACKUP_PASSPHRASE"
          echo "::notice::backup chiffré : $(wc -c < backup-$(date +%Y-%m-%d).dump.enc) octets"
          rm -f backup.dump

      - name: Conserver la sauvegarde (30 jours glissants)
        uses: actions/upload-artifact@v4
        with:
          name: sauvegarde-db-${{ github.run_id }}
          path: backup-*.dump.enc
          retention-days: 30
